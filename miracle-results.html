<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="miracle杯">
<style>
:root{--ink:#1a2332;--line:#d3dbe8;--head:#2b3a67;--accent:#e8407a;--rest:#9aa6bd;--bg:#f4f6fb;--gold:#f6c945;}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg);margin:0;padding:20px}
.wrap{max-width:760px;margin:0 auto}
.title{text-align:center;margin:0 0 2px;font-size:32px;letter-spacing:2px;color:var(--head)}
.title b{color:var(--accent)}
.sub{text-align:center;color:var(--rest);margin:0 0 16px;font-size:13px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 18px;font-size:15px;font-weight:700;cursor:pointer;color:var(--rest)}
.tab.on{color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px;margin-bottom:18px;box-shadow:0 2px 10px rgba(40,60,110,.05)}
h2{font-size:16px;margin:0 0 12px;padding-left:10px;border-left:5px solid var(--accent);color:var(--head)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 5px;text-align:center}
thead th{background:var(--head);color:#fff;font-weight:600;font-size:12.5px}
.rank{font-weight:800;font-size:15px;width:38px}
.r1{background:#fff7df}.r2{background:#f1f4f9}.r3{background:#fbeee2}
.medal{font-size:15px}
.tname{font-weight:700;text-align:left;padding-left:10px}
.small{color:var(--rest);font-size:12px}
.pos{color:#1f9d57;font-weight:700}.neg{color:#d33;font-weight:700}
.mt-list table{font-size:13px}
.mt-list .vs{color:var(--rest);font-size:11px}
.mt-list input{width:42px;text-align:center;font-size:15px;padding:5px 2px;border:1px solid var(--line);border-radius:6px}
.mt-list input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.mt-list .ta{text-align:right;padding-right:8px;font-weight:600}
.mt-list .tb{text-align:left;padding-left:8px;font-weight:600}
.setlbl{font-size:11px;color:var(--rest)}
.done{background:#f3fbf5}
.mt-list input.tie{border:2px solid #d33;background:#fff0f0}
.mt-list input.bad{border:2px solid #e8a317;background:#fff8e6}
.warn{font-size:12px;color:#b00;margin-top:6px;line-height:1.7}
.warn.ok{color:#1f9d57}
.mt-list .when{font-size:11px;color:var(--rest);white-space:nowrap;line-height:1.4}
.bar{text-align:center;margin-bottom:14px}
.bar button{background:var(--head);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;margin:3px 4px}
.note{font-size:12px;color:var(--rest);margin-top:8px;line-height:1.7}
.abtn{background:var(--head);color:#fff;border:0;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;margin:0 2px}
.abtn.del{background:#c0392b}
@page{size:A4 portrait;margin:0} /* 余白0でブラウザのURL/日付印字を消す */
@media print{body{background:#fff;padding:12mm}.noprint{display:none}.card{box-shadow:none;page-break-inside:avoid}}
</style></head><body><div class="wrap">
<h1 class="title"><b>miracle</b>杯 <span style="font-size:20px">結果・順位</span></h1>
<p class="sub">2セット制・<span id="ruleline"></span> ／ 順位は「① 獲得セット数 → ② 直接対決 → ③ 得失点差」で自動計算 ／ チーム数は進行表アプリの設定に連動</p>
<div class="tabs" id="tabs"></div>
<div class="bar noprint">
  <button onclick="window.print()">🖨 順位表を印刷/PDF</button>
  <button onclick="exportData()">💾 データ保存</button>
  <button onclick="document.getElementById('imp').click()">📂 データ読込</button>
  <input id="imp" type="file" accept=".json,application/json" style="display:none">
  <button onclick="clearLeague()">このリーグの結果をクリア</button>
  <button onclick="clearAll()" style="background:#c0392b">🗑 全データクリア</button>
</div>
<details class="card noprint" id="namepanel">
  <summary style="cursor:pointer;font-weight:700;color:var(--head);font-size:15px">✏️ チーム名を入力（クリックで開閉／進行表アプリと共有）</summary>
  <div id="namegrid" style="display:flex;gap:20px;flex-wrap:wrap;margin-top:14px"></div>
</details>
<div id="stand"></div>
<div id="matches"></div>
<div id="archwrap"></div>
<p class="note">※各試合とも「1セット目」「2セット目」の両チームの得点を入力してください。両チームに値が入ったセットだけ集計します。<br>
※試合の並び順・枠・時刻は進行表アプリと同じ（対戦カードの「第N試合」と一致）。<br>※チーム数・チーム名は進行表アプリ（miracle-cup.html）の設定と共有。結果はこの端末に自動保存されます。</p>
</div>
<script>
const CK='miracle_config_v1', NK='miracle_names_v2', RK='miracle_results_v2', SK='miracle_schedule_v1', AK='miracle_archive_v1';
const DEF={w:8,m1:7,m2:7,start:'09:00',dur:25,pt:15,cap:17};
let cfg=Object.assign({},DEF);
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CK))||{})}catch(e){}
const LEAGUES=[
 {key:'w', name:'女子',   color:'#e8407a'},
 {key:'m1',name:'混合①', color:'#2f6fe0'},
 {key:'m2',name:'混合②', color:'#1f9d57'},
];
const size=lg=>({w:cfg.w,m1:cfg.m1,m2:cfg.m2})[lg];
let names={}, results={}, cur='w';
try{names=JSON.parse(localStorage.getItem(NK))||{}}catch(e){}
try{results=JSON.parse(localStorage.getItem(RK))||{}}catch(e){}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const nm=(lg,t)=>names[lg+':'+t]||(''+t);
function roundRobin(n){
  if(n<2)return [];
  const arr=[];for(let i=1;i<=n;i++)arr.push(i);
  if(n%2)arr.push(0);
  const m=arr.length,rounds=[];let a=arr.slice();
  for(let r=0;r<m-1;r++){
    const rd=[];
    for(let i=0;i<m/2;i++){const x=a[i],y=a[m-1-i];if(x&&y)rd.push([x,y]);}
    rounds.push(rd);a=[a[0],a[m-1]].concat(a.slice(1,m-1));
  }
  return rounds;
}
const sizeOf=(lg,C)=>({w:C.w,m1:C.m1,m2:C.m2})[lg];
const pairsFor=(lg,C)=>roundRobin(sizeOf(lg,C)).flat();
const pairsOf=lg=>pairsFor(lg,cfg);
const rkey=(lg,p)=>lg+':'+Math.min(p[0],p[1])+'-'+Math.max(p[0],p[1]);
let sched=null; try{sched=JSON.parse(localStorage.getItem(SK))}catch(e){}
/* 進行表アプリが保存した順番（枠・時刻・コート付き）。チーム数が合わなければ総当たり順に戻す */
function orderedMatches(lg){
  const base=pairsOf(lg);
  if(sched&&sched.lg&&sched.lg[lg]&&sched.cfg&&sizeOf(lg,sched.cfg)==sizeOf(lg,cfg)){
    const list=sched.lg[lg];
    const a=new Set(base.map(p=>rkey(lg,p))), b=new Set(list.map(m=>rkey(lg,[m.a,m.b])));
    if(a.size===b.size&&[...a].every(x=>b.has(x))) return list.map(m=>({p:[m.a,m.b],slot:m.slot,court:m.court}));
  }
  return base.map(p=>({p,slot:null,court:null}));
}
function timeOf(i){
  const [h,m]=(cfg.start||'09:00').split(':').map(Number);
  const tot=h*60+m+(i-1)*(+cfg.dur||25);
  return String(Math.floor(tot/60)%24).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
}
/* セット得点のチェック: ok / tie(同点) / bad(ルール外・未完了) / empty */
function setStatus(x,y){
  if(x===''||y===''||x==null||y==null)return 'empty';
  x=+x;y=+y; if(x===y)return 'tie';
  const pt=+cfg.pt||15, cap=+cfg.cap||17, w=Math.max(x,y), l=Math.min(x,y);
  if(w===pt&&l<=pt-2)return 'ok';
  if(w>pt&&w<cap&&w-l===2)return 'ok';
  if(w===cap&&cap>pt&&(w-l===2||w-l===1))return 'ok';
  return 'bad';
}

function calc(lg){return calc2(lg,cfg,results);}
function calc2(lg,C,R){
  const n=sizeOf(lg,C); const st={}; const hh={};
  for(let t=1;t<=n;t++)st[t]={t,g:0,w:0,d:0,l:0,sw:0,sl:0,pf:0,pa:0};
  pairsFor(lg,C).forEach(pr=>{
    const r=R[rkey(lg,pr)];if(!r)return;
    const [a,b]=pr;let sA=0,sB=0,played=false;
    [[r.s1a,r.s1b],[r.s2a,r.s2b]].forEach(([x,y])=>{
      if(x===''||y===''||x==null||y==null)return;
      x=+x;y=+y;played=true;
      st[a].pf+=x;st[a].pa+=y;st[b].pf+=y;st[b].pa+=x;
      if(x>y){st[a].sw++;st[b].sl++;sA++;}
      else if(y>x){st[b].sw++;st[a].sl++;sB++;}
    });
    if(!played)return;
    st[a].g++;st[b].g++;
    hh[rkey(lg,pr)]={a,b,sa:sA,sb:sB};
    if(sA>sB){st[a].w++;st[b].l++;}
    else if(sB>sA){st[b].w++;st[a].l++;}
    else{st[a].d++;st[b].d++;}
  });
  /* 直接対決: t1が勝っていればt1、t2ならt2、引き分け/未実施は0 */
  const dir=(t1,t2)=>{
    const m=hh[lg+':'+Math.min(t1,t2)+'-'+Math.max(t1,t2)];
    if(!m)return 0;
    const s1=m.a===t1?m.sa:m.sb, s2=m.a===t1?m.sb:m.sa;
    return s1>s2?t1:(s2>s1?t2:0);
  };
  /* ①セット数 → (②は後段) → ③得失点差 → 得点 → チーム番号 で仮ソート */
  const arr=Object.values(st);
  arr.sort((x,y)=>(y.sw-x.sw)||((y.pf-y.pa)-(x.pf-x.pa))||(y.pf-x.pf)||(x.t-y.t));
  /* ②セット数が同じ2チームは直接対決の勝者を上に(3チーム以上の同数は得失点差のまま) */
  let i=0;
  while(i<arr.length){
    let j=i; while(j<arr.length&&arr[j].sw===arr[i].sw)j++;
    if(j-i===2){
      const w=dir(arr[i].t,arr[i+1].t);
      if(w===arr[i+1].t){const tmp=arr[i];arr[i]=arr[i+1];arr[i+1]=tmp;}
    }
    i=j;
  }
  /* 順位番号: セット数同じ・直接対決で決まらず・得失点差も同じ → 同順位 */
  let rank=1;
  arr.forEach((row,idx)=>{
    if(idx>0){
      const p=arr[idx-1];
      const same=(p.sw===row.sw)&&(dir(p.t,row.t)===0)&&((p.pf-p.pa)===(row.pf-row.pa));
      rank=same?p._rank:idx+1;
    }
    row._rank=rank;
  });
  return arr;
}
function standCardHTML(lg,C,N,R){
  const L=LEAGUES.find(l=>l.key===lg);const arr=calc2(lg,C,R);
  const gname=t=>esc(N[lg+':'+t]||(''+t));
  const medal=r=>r===1?'🥇':r===2?'🥈':r===3?'🥉':'';
  let rows='';
  arr.forEach(row=>{
    const d=row.pf-row.pa;
    const dc=d>0?'pos':(d<0?'neg':'');
    const cls=row._rank===1?'r1':row._rank===2?'r2':row._rank===3?'r3':'';
    rows+=`<tr class="${cls}">
      <td class="rank"><span class="medal">${medal(row._rank)}</span>${row._rank}</td>
      <td class="tname">${gname(row.t)}</td>
      <td>${row.g}</td><td class="small">${row.w}-${row.d}-${row.l}</td>
      <td style="font-weight:700">${row.sw}</td>
      <td>${row.pf}</td><td>${row.pa}</td>
      <td class="${dc}">${d>0?'+':''}${d}</td></tr>`;
  });
  return `<div class="card"><h2 style="border-color:${L.color}">${L.name} 順位表（${sizeOf(lg,C)}チーム）</h2>
    <table><thead><tr><th>順位</th><th>チーム</th><th>試合</th><th>勝分敗</th><th>獲得<br>セット</th><th>得点</th><th>失点</th><th>得失差</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <p class="note">並び順：① 獲得セット数の多い順 → ② セット数が同じ2チームは<b>直接対決の勝者が上</b> → ③ 得失点差の大きい順（さらに同じなら得点→チーム番号）。<br>※セット数が同じチームが3つ以上並んだ場合と、直接対決が引き分け（1-1）の場合は得失点差で決めます。🥇🥈🥉は上位3。</p></div>`;
}
function renderStand(){
  document.getElementById('stand').innerHTML=standCardHTML(cur,cfg,names,results);
}
function markSet(row,key,r){
  /* 入力欄に同点(赤)/ルール外(黄)の印を付ける */
  let tie=0,bad=0;
  [['s1a','s1b'],['s2a','s2b']].forEach(([fa,fb])=>{
    const st=setStatus(r[fa],r[fb]);
    row.querySelectorAll(`input[data-f="${fa}"],input[data-f="${fb}"]`).forEach(inp=>{inp.classList.toggle('tie',st==='tie');inp.classList.toggle('bad',st==='bad');});
    if(st==='tie')tie++; if(st==='bad')bad++;
  });
  return {tie,bad};
}
function renderWarn(){
  const el=document.getElementById('warnline'); if(!el)return;
  let tie=0,bad=0;
  orderedMatches(cur).forEach(m=>{const r=results[rkey(cur,m.p)]||{};
    [['s1a','s1b'],['s2a','s2b']].forEach(([fa,fb])=>{const st=setStatus(r[fa],r[fb]);if(st==='tie')tie++;if(st==='bad')bad++;});});
  const pt=+cfg.pt||15,cap=+cfg.cap||17;
  if(!tie&&!bad){el.className='warn ok';el.textContent='入力済みのセット得点はすべてルール通りです。';return;}
  el.className='warn';
  el.innerHTML=(tie?`<b>赤：同点のセットが${tie}つ</b>あります（同点はどちらのセットにも数えません）。 `:'')+
    (bad?`<b>黄：ルール外／未完了のセットが${bad}つ</b>あります（${pt}点先取・2点差、${pt-1}-${pt-1}からデュース、${cap}点で打ち切り）。得点はそのまま集計します。`:'');
}
function renderMatches(){
  const L=LEAGUES.find(l=>l.key===cur);const ms=orderedMatches(cur);
  const hasSched=ms.some(m=>m.slot!=null);
  let rows='';
  ms.forEach((m,i)=>{
    const [a,b]=m.p;const key=rkey(cur,m.p);const r=results[key]||{};
    const v=f=>(r[f]!=null?r[f]:'');
    const filled=['s1a','s1b','s2a','s2b'].every(f=>v(f)!=='');
    const when=hasSched?`<td class="when">第${m.slot}枠<br>${timeOf(m.slot)}<br>コート${m.court}</td>`:'';
    rows+=`<tr class="mrow ${filled?'done':''}">
      <td class="small">${i+1}</td>${when}
      <td class="ta">${esc(nm(cur,a))}</td>
      <td><span class="setlbl">1st</span><br><input inputmode="numeric" data-k="${key}" data-f="s1a" value="${v('s1a')}"> <span class="vs">-</span> <input inputmode="numeric" data-k="${key}" data-f="s1b" value="${v('s1b')}"></td>
      <td><span class="setlbl">2nd</span><br><input inputmode="numeric" data-k="${key}" data-f="s2a" value="${v('s2a')}"> <span class="vs">-</span> <input inputmode="numeric" data-k="${key}" data-f="s2b" value="${v('s2b')}"></td>
      <td class="tb">${esc(nm(cur,b))}</td></tr>`;
  });
  document.getElementById('matches').innerHTML=`<div class="card mt-list"><h2 style="border-color:${L.color}">${L.name} 試合結果入力（全${ms.length}試合）</h2>
    <table><thead><tr><th>試合</th>${hasSched?'<th>枠・時刻<br>コート</th>':''}<th>チーム</th><th>1セット目</th><th>2セット目</th><th>チーム</th></tr></thead><tbody>${rows}</tbody></table>
    <div id="warnline" class="warn"></div>
    ${hasSched?'':'<p class="note">※進行表アプリを一度開くと、ここが進行表の順番（枠・時刻・コート付き）になります。</p>'}</div>`;
  document.querySelectorAll('#matches tr.mrow').forEach(row=>{const inp=row.querySelector('input');markSet(row,inp.dataset.k,results[inp.dataset.k]||{});});
  renderWarn();
  document.querySelectorAll('#matches input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const key=inp.dataset.k,f=inp.dataset.f;
      results[key]=results[key]||{};
      results[key][f]=inp.value.replace(/[^0-9]/g,'');
      inp.value=results[key][f];
      localStorage.setItem(RK,JSON.stringify(results));
      const row=inp.closest('tr');
      const done=['s1a','s1b','s2a','s2b'].every(x=>(results[key][x]||'')!=='');
      row.classList.toggle('done',done);
      markSet(row,key,results[key]);
      renderWarn();
      renderStand();
    });
  });
}
function renderNamePanel(){
  document.getElementById('namegrid').innerHTML=LEAGUES.map(L=>{
    const n=size(L.key);if(n<2)return '';
    let inputs='';
    for(let t=1;t<=n;t++){
      const v=esc(names[L.key+':'+t]||'');
      inputs+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
        <span style="width:18px;text-align:right;color:${L.color};font-weight:700">${t}</span>
        <input data-lg="${L.key}" data-t="${t}" value="${v}" placeholder="チーム${t}"
        style="width:140px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:13px"></div>`;
    }
    return `<div><div style="font-weight:700;color:${L.color};margin-bottom:8px;border-bottom:2px solid ${L.color};padding-bottom:3px">${L.name}</div>${inputs}</div>`;
  }).join('');
  document.querySelectorAll('#namegrid input').forEach(inp=>inp.addEventListener('input',()=>{
    const key=inp.dataset.lg+':'+inp.dataset.t,val=inp.value.trim();
    if(val)names[key]=val;else delete names[key];
    localStorage.setItem(NK,JSON.stringify(names));
    renderStand();renderMatches();
  }));
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=LEAGUES.filter(l=>size(l.key)>=2).map(l=>
    `<button class="tab ${l.key===cur?'on':''}" style="${l.key===cur?'background:'+l.color+';border-color:'+l.color:''}" onclick="setCur('${l.key}')">${l.name}（${size(l.key)}）</button>`).join('');
}
function setCur(k2){cur=k2;renderAll();}
function clearLeague(){
  const L=LEAGUES.find(l=>l.key===cur);
  if(!confirm(L.name+'の入力結果を全部消します。よろしいですか？'))return;
  pairsOf(cur).forEach(pr=>delete results[rkey(cur,pr)]);
  localStorage.setItem(RK,JSON.stringify(results));renderAll();
}
function exportData(){
  const data={config:cfg,names:JSON.parse(localStorage.getItem(NK)||'{}'),
    results:JSON.parse(localStorage.getItem(RK)||'{}'),
    archive:JSON.parse(localStorage.getItem(AK)||'[]'),
    schedule:JSON.parse(localStorage.getItem(SK)||'null')};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='miracle杯-データ.json';a.click();URL.revokeObjectURL(a.href);
}
document.getElementById('imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);
    if(d.config)localStorage.setItem(CK,JSON.stringify(d.config));
    if(d.names)localStorage.setItem(NK,JSON.stringify(d.names));
    if(d.results)localStorage.setItem(RK,JSON.stringify(d.results));
    if(d.archive)localStorage.setItem(AK,JSON.stringify(d.archive));
    if(d.schedule)localStorage.setItem(SK,JSON.stringify(d.schedule));
    alert('読み込みました');location.reload();
  }catch(err){alert('このファイルは読み込めませんでした');}};rd.readAsText(f);
});
/* ---- 過去の戦績アーカイブ ---- */
let archive=[]; try{archive=JSON.parse(localStorage.getItem(AK))||[]}catch(e){}
let viewIdx=null;
function saveArchive(){localStorage.setItem(AK,JSON.stringify(archive));}
function snapshotIfAny(){
  const res=JSON.parse(localStorage.getItem(RK)||'{}');
  if(Object.keys(res).length===0)return false;
  const def='miracle杯 '+new Date().toLocaleDateString('ja-JP');
  const name=prompt('この大会の戦績を「過去の戦績」に残します。\nアーカイブ名（大会名など）:',def);
  archive.push({name:(name&&name.trim())||def, savedAt:new Date().toISOString(),
    config:Object.assign({},cfg),
    names:JSON.parse(localStorage.getItem(NK)||'{}'), results:res});
  saveArchive();
  return true;
}
function renderArchive(){
  let html='';
  if(archive.length){
    let rows='';
    archive.forEach((a,i)=>{
      const d=new Date(a.savedAt).toLocaleDateString('ja-JP');
      rows+=`<tr><td class="tname">${esc(a.name)}</td><td class="small">${d}</td>
        <td><button class="abtn" onclick="viewArchive(${i})">📖 見る</button>
        <button class="abtn del" onclick="delArchive(${i})">削除</button></td></tr>`;
    });
    html=`<div class="card"><h2 style="border-color:#8a6bd1">📚 過去の戦績</h2>
      <table><thead><tr><th>大会</th><th>保存日</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">「🗑 全データクリア」時に自動保存された戦績です。ここは全データクリアでも消えません。</p></div>`;
  }
  document.getElementById('archwrap').innerHTML=html;
}
function viewArchive(i){viewIdx=i;renderAll();window.scrollTo(0,0);}
function backCurrent(){viewIdx=null;renderAll();}
function delArchive(i){
  if(!confirm(`「${archive[i].name}」の戦績を削除します。元に戻せません。よろしいですか？`))return;
  archive.splice(i,1);saveArchive();
  if(viewIdx===i)viewIdx=null; else if(viewIdx>i)viewIdx--;
  renderAll();
}
function clearAll(){
  if(!confirm('全データ（チーム名・試合結果・大会設定）を消して初期状態に戻します。\n※試合結果が入っていれば、戦績は「📚 過去の戦績」に自動で残ります。\n\nクリアしますか？'))return;
  if(!confirm('この操作は元に戻せません。本当によろしいですか？'))return;
  snapshotIfAny();
  [CK,NK,RK,SK,'miracl_config_v1','miracl_names_v2','miracl_results_v2'].forEach(k2=>localStorage.removeItem(k2));
  alert('クリアしました（戦績はアーカイブに保存済み）');
  location.reload();
}
function renderAll(){
  document.getElementById('ruleline').textContent=`${cfg.pt||15}点マッチ（デュースは${cfg.cap||17}点打ち切り）`;
  if(viewIdx!=null&&archive[viewIdx]){
    const a=archive[viewIdx]; a.config=Object.assign({},DEF,a.config||{});
    document.getElementById('tabs').innerHTML='';
    document.getElementById('stand').innerHTML=
      `<div class="card" style="background:#f5f0ff;border-color:#c9b8ef">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <b style="font-size:16px;color:#5b3fa8">📚 ${esc(a.name)}（${new Date(a.savedAt).toLocaleDateString('ja-JP')}保存）</b>
        <button class="abtn" style="font-size:14px" onclick="backCurrent()">← 現在の大会に戻る</button></div></div>`+
      LEAGUES.filter(l=>sizeOf(l.key,a.config)>=2).map(l=>standCardHTML(l.key,a.config,a.names,a.results)).join('');
    document.getElementById('matches').innerHTML='';
    renderArchive();
    return;
  }
  renderTabs();renderNamePanel();renderStand();renderMatches();renderArchive();
}
renderAll();
</script></body></html>
